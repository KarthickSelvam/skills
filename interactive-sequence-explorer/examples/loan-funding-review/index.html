<!doctype html>
<!--
Built by the interactive-sequence-explorer skill. Do not edit this file by hand:
edit the flow data and rerun build.js.
World: railway signal-box mimic panel. Each system is a track, each call a lit train
travelling its route. Lamps: white = route set, amber = moving, green = done, red = stopped.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan funding review</title>
<style>
:root{
  --cabinet:#262d29;
  --cabinet-2:#1d2320;
  --cabinet-edge:#3a433e;
  --enamel:#c6d0c1;
  --enamel-hi:#d3dccf;
  --enamel-lo:#b3bead;
  --ink:#141a17;
  --ink-2:#334038;
  --ink-3:#4c5a51;
  --plate:#eff1e8;
  --plate-2:#e2e6da;
  --plate-ink:#161c19;
  --plate-mute:#4a564e;
  --name:#121614;
  --name-ink:#eef1e6;
  --lamp-off:#56625a;
  --lamp-set:#fbf8ec;
  --lamp-occ:#f2a516;
  --lamp-occ-deep:#c9800a;
  --lamp-done:#2e9a52;
  --lamp-stop:#d4392a;
  --lamp-ret:#6cb8e0;
  --code-bg:#1a201d;
  --code-ink:#e3e8dc;
  --code-key:#9fd3a8;
  --code-str:#f3c879;
  --code-num:#9cc8ef;
  --code-lit:#f0928a;
  --code-mute:#8a978e;
  --font:"Bahnschrift","DIN Alternate","DIN 2014","D-DIN","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SFMono-Regular",ui-monospace,monospace;
  --lane-w:212px;
  --stud-h:86px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cabinet);color:var(--name-ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp-occ);outline-offset:2px}
.board :focus-visible,.plate :focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--lamp-occ)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:3px;background:var(--cabinet-edge);color:var(--name-ink);border:1px solid #4b5650}

.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:560px}

/* header */
.hdr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;padding:14px 22px 12px;border-bottom:1px solid var(--cabinet-edge);background:linear-gradient(var(--cabinet),var(--cabinet-2))}
.hdr h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.01em;font-stretch:condensed;font-variation-settings:"wdth" 75}
.hdr-sub{margin:2px 0 0;color:#aab6ad;font-size:13px;max-width:34ch}
.routes{display:flex;gap:10px;justify-content:center}
.route-plate{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:7px 16px 7px 8px;background:var(--name);border:1px solid #3f4943;border-radius:4px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #0b0e0c;transition:background .2s,border-color .2s}
.route-plate:hover{border-color:#6c7a71}
.rp-code{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--lamp-off);color:var(--name);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35)}
.rp-name{font-weight:600;font-size:15px;letter-spacing:.02em}
.rp-desc{font-size:12px;color:#94a197}
.route-plate[aria-pressed="true"]{border-color:var(--lamp-set);background:#0d100e}
.route-plate[aria-pressed="true"] .rp-code{background:var(--lamp-set);box-shadow:0 0 0 3px rgba(251,248,236,.16)}
.hdr-tools{display:flex;align-items:center;gap:18px}
.seg{display:inline-flex;background:var(--cabinet-2);border:1px solid var(--cabinet-edge);border-radius:4px;padding:3px}
.seg-btn{border:0;background:transparent;padding:6px 12px;border-radius:3px;font-size:13px;font-weight:600;letter-spacing:.03em;color:#aab6ad;cursor:pointer}
.seg-btn:hover{color:var(--name-ink)}
.seg-btn[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:600;color:#c9d3cb}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch-track{width:38px;height:22px;border-radius:11px;background:var(--cabinet-2);border:1px solid #4b5650;position:relative;transition:background .2s}
.switch-track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--lamp-off);transition:transform .25s var(--ease),background .2s}
.switch input:checked+.switch-track{background:#3a1814;border-color:var(--lamp-stop)}
.switch input:checked+.switch-track::after{transform:translateX(16px);background:var(--lamp-stop);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.switch input:focus-visible+.switch-track{outline:3px solid var(--lamp-occ);outline-offset:2px}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);min-height:0}
.board-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 0 0 18px}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 18px 10px 0;flex-wrap:wrap}
.board-legend{display:flex;gap:16px;font-size:12px;color:#aab6ad;letter-spacing:.03em}
.board-legend span{display:inline-flex;align-items:center;gap:6px}
.lamp{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 -1px 2px rgba(0,0,0,.4)}
.lamp.l-set{background:var(--lamp-set)}
.lamp.l-occ{background:radial-gradient(circle at 38% 34%,#ffe2a3 0 22%,var(--lamp-occ) 62%);box-shadow:0 0 0 2px rgba(242,165,22,.35)}
.lamp.l-done{background:var(--lamp-done)}
.lamp.l-stop{background:var(--lamp-stop)}
.lamp.l-ret{background:var(--lamp-ret)}
.board-actions{display:flex;gap:8px}
.chip-btn{background:transparent;border:1px solid #4b5650;color:#c9d3cb;border-radius:3px;padding:5px 10px;font-size:12px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.chip-btn:hover{border-color:#8a978e;color:var(--name-ink)}
.chip-btn[aria-pressed="true"]{background:var(--lamp-set);color:var(--name);border-color:var(--lamp-set)}

.board{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;background:var(--enamel);border-radius:6px 0 0 0;box-shadow:inset 0 1px 0 var(--enamel-hi),inset 0 0 0 1px #9aa697,0 6px 18px rgba(0,0,0,.35);background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.05) 1px,transparent 1.5px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;scroll-behavior:smooth}
.lanes{position:sticky;left:0;z-index:3;flex:0 0 var(--lane-w);padding-top:var(--stud-h);background:linear-gradient(90deg,var(--enamel-hi) 0,var(--enamel) 88%,rgba(198,208,193,0));min-height:100%}
.lane{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px dashed rgba(20,26,23,.12);transition:opacity .25s}
.lane-plate{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--name);color:var(--name-ink);border:0;border-radius:3px;padding:6px 9px;text-align:left;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.25)}
.lane-plate:hover{background:#252b28}
.lane-plate .lamp{flex:none}
.lane-name{font-size:13px;font-weight:600;letter-spacing:.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-kind{display:block;font-size:10.5px;font-weight:400;color:#93a096;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-fold{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid rgba(20,26,23,.35);background:var(--enamel-hi);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.lane-fold svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;transition:transform .3s var(--ease)}
.lane.folded .lane-fold svg{transform:rotate(-90deg)}
.lane.folded .lane-plate{padding:2px 9px;box-shadow:none;background:#2f3632}
.lane.folded .lane-kind{display:none}
.lane.folded .lane-name{font-size:11px}
.lane.active .lane-plate{outline:2px solid var(--lamp-occ);outline-offset:1px}

.tracks{position:relative;flex:none}
.studs{position:sticky;top:0;z-index:2;display:flex;height:var(--stud-h);background:linear-gradient(var(--enamel-hi),var(--enamel) 80%,rgba(198,208,193,0))}
.stud{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding-top:10px;border:0;background:transparent;cursor:pointer;color:var(--ink-2)}
.stud-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--plate);color:var(--ink);border:2px solid var(--ink);transition:background .25s,color .25s,box-shadow .25s}
.stud-title{font-size:11.5px;line-height:1.2;font-weight:600;text-align:center;max-width:136px;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stud.done .stud-num{background:#1f7a3d;color:#fff;border-color:#155a2c}
.stud.current .stud-num{background:var(--lamp-occ);border-color:var(--ink);box-shadow:0 0 0 4px rgba(242,165,22,.3)}
.stud.current .stud-title{color:var(--ink)}
.stud.alt .stud-num{border-color:var(--lamp-stop);border-style:dashed}
.stud.alt.current .stud-num{background:var(--lamp-stop);color:#fff}
.stud:hover .stud-title{color:var(--ink)}
.svg{display:block;overflow:visible}

/* svg parts */
.trk{stroke:var(--ink);stroke-width:5;stroke-linecap:butt}
.trk-folded{stroke:var(--ink-3);stroke-width:2}
.joint{stroke:var(--enamel);stroke-width:3}
.trk-occ{stroke:var(--lamp-occ);stroke-width:5}
.col-band{fill:rgba(255,255,255,.0);transition:fill .3s}
.col-band.on{fill:rgba(255,255,255,.22)}
.route{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-dasharray:3 5;opacity:.45}
.route.set{stroke:var(--lamp-set);stroke-dasharray:none;stroke-width:3;opacity:1;filter:drop-shadow(0 0 1.5px rgba(20,26,23,.9))}
.route.past{stroke:var(--lamp-done);stroke-dasharray:none;stroke-width:2;opacity:.75}
.route.alt{stroke:var(--lamp-stop)}
.lmp{stroke:var(--ink);stroke-width:1.5;fill:var(--lamp-off)}
.lmp.set{fill:var(--lamp-set)}
.lmp.occ{fill:var(--lamp-occ);filter:drop-shadow(0 0 5px rgba(242,165,22,.9))}
.lmp.done{fill:var(--lamp-done)}
.lmp.stop{fill:var(--lamp-stop);filter:drop-shadow(0 0 5px rgba(212,57,42,.8))}
.lmp.past{fill:#5f9c70}
.lmp.ret{fill:var(--lamp-ret)}
.self-loop{fill:none;stroke-width:3}
.train rect{fill:var(--lamp-occ);stroke:var(--ink);stroke-width:1.5}
.train text{font-family:var(--font);font-size:11px;font-weight:700;fill:var(--ink);letter-spacing:.02em}
.train.stop rect{fill:var(--lamp-stop)}
.train.stop text{fill:#fff}
.train.ret rect{fill:var(--lamp-ret)}
.trk-occ.ret{stroke:var(--lamp-ret)}
.train-glow{fill:var(--lamp-occ);opacity:.35;filter:blur(6px)}
.berth{font-family:var(--font);font-size:10.5px;font-weight:600;fill:var(--ink-2);letter-spacing:.03em}

/* plate */
.plate{background:var(--plate);color:var(--plate-ink);overflow:auto;border-left:1px solid #0c0f0d;box-shadow:inset 1px 0 0 #fff;padding:20px 22px 28px;min-height:0}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.p-pos{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--plate-mute)}
.p-kind{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:3px;background:var(--name);color:var(--name-ink)}
.p-kind.alt{background:var(--lamp-stop);color:#fff}
.p-title{margin:0 0 12px;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.005em;font-stretch:condensed;font-variation-settings:"wdth" 80;text-wrap:balance}
.p-route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.p-stop{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:3px;background:var(--name);color:var(--name-ink);font-size:12.5px;font-weight:600;cursor:pointer;border:0}
.p-stop .lamp{width:9px;height:9px}
.p-arrow{color:var(--plate-mute);font-weight:700}
.p-story{font-size:17px;line-height:1.5;margin:0 0 16px;max-width:60ch;text-wrap:pretty}
.p-why{margin:0 0 18px;padding:10px 12px;background:var(--plate-2);border-radius:4px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.p-why b{color:var(--plate-ink)}
.p-rt{display:grid;gap:4px;margin:0 0 14px;font-size:13px}
.p-rt span{display:flex;gap:8px;align-items:center}
.p-rt i{display:inline-block;min-width:62px;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--plate-mute)}
.p-rt b{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:3px;border:1px solid var(--ink);background:var(--lamp-occ);color:var(--ink)}
.p-rt .back b{background:var(--lamp-ret)}
.call{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;background:var(--code-bg);color:var(--code-ink);border-radius:4px;font-family:var(--mono);font-size:12.5px;line-height:1.5;word-break:break-all}
.verb{font-weight:700;padding:1px 6px;border-radius:2px;background:var(--lamp-occ);color:var(--ink);flex:none}
.verb.v-get{background:#9cc8ef}
.verb.v-sql{background:#9fd3a8}
.verb.v-aws{background:#f3c879}
.verb.v-sdk{background:#d7c1f2}
.verb.v-in{background:var(--plate-2)}
details.sec{border-top:1px solid #c9cfc1;padding:2px 0}
details.sec>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer;font-weight:700;font-size:13.5px;letter-spacing:.04em}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .cnt{font-weight:400;color:var(--plate-mute);font-size:12px;letter-spacing:.02em;margin-left:6px}
details.sec>summary .chev{width:22px;height:22px;border-radius:50%;background:var(--plate-2);display:grid;place-items:center;flex:none;transition:transform .3s var(--ease)}
details.sec>summary .chev svg{width:11px;height:11px;stroke:var(--plate-ink);stroke-width:2.6;fill:none}
details.sec[open]>summary .chev{transform:rotate(180deg)}
.sec-body{padding:0 0 14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;margin:0;font-size:13px}
.kv dt{font-weight:700;color:var(--plate-mute)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.codebox{position:relative;margin:8px 0 0}
.codebox pre{margin:0;max-height:340px;overflow:auto;padding:12px 14px;background:var(--code-bg);color:var(--code-ink);border-radius:4px;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre}
.codebox .cap{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--plate-mute);letter-spacing:.04em}
.copy{border:1px solid #b7bfb2;background:transparent;border-radius:3px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;color:var(--plate-mute)}
.copy:hover{color:var(--plate-ink);border-color:var(--plate-ink)}
.copy.ok{background:#1f7a3d;color:#fff;border-color:#1f7a3d}
.j-k{color:var(--code-key)}.j-s{color:var(--code-str)}.j-n{color:var(--code-num)}.j-l{color:var(--code-lit)}.j-c{color:var(--code-mute);font-style:italic}
.tbl{margin:10px 0 0;border:1px solid #c9cfc1;border-radius:4px;overflow:hidden}
.tbl-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:7px 10px;background:var(--name);color:var(--name-ink)}
.tbl-name{font-family:var(--mono);font-size:12.5px;font-weight:700}
.tbl-op{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--lamp-occ)}
.tbl-cols{margin:0;padding:8px 10px;list-style:none;display:grid;gap:3px;font-size:12.5px}
.tbl-cols li{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:10px}
.tbl-cols code{font-family:var(--mono);font-size:12px;color:var(--plate-ink)}
.tbl-cols span{color:var(--ink-3)}
details.tbl-sql{border-top:1px solid #c9cfc1}
details.tbl-sql>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--plate-mute)}
details.tbl-sql>summary::-webkit-details-marker{display:none}
details.tbl-sql>summary::after{content:'+';font-family:var(--mono);font-size:14px}
details.tbl-sql[open]>summary::after{content:'-'}
details.tbl-sql .codebox{margin:0 10px 10px}
.tbl-uses{margin:0;padding:6px 10px 8px;list-style:none;display:grid;gap:3px;font-size:12.5px}
.tbl-uses a{color:var(--plate-ink)}
ul.notes{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
ul.notes li{margin:0 0 5px}
ul.notes code,.p-story code,.p-why code{font-family:var(--mono);font-size:.88em;background:var(--plate-2);padding:0 4px;border-radius:2px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ref{font-size:12px;font-weight:600;padding:3px 8px;border-radius:3px;border:1px solid #b7bfb2;color:var(--ink-2)}
.p-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:2px solid var(--plate-ink)}
.p-nav button{flex:1;text-align:left;border:1px solid #b7bfb2;background:transparent;border-radius:4px;padding:8px 10px;cursor:pointer;font-size:12.5px;color:var(--plate-mute)}
.p-nav button b{display:block;color:var(--plate-ink);font-size:13.5px}
.p-nav button:last-child{text-align:right}
.p-nav button:hover{border-color:var(--plate-ink)}
.p-nav button:disabled{opacity:.35;cursor:default}
.lane-card .p-story{font-size:16px}

/* console */
.console{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:22px;padding:12px 22px;background:linear-gradient(var(--cabinet-2),#161b18);border-top:1px solid var(--cabinet-edge)}
.lever-group{display:flex;align-items:flex-end;gap:10px}
.lever{width:44px;height:44px;border-radius:6px 6px 10px 10px;border:1px solid #0b0e0c;background:linear-gradient(#3a423e,#252b28);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #0b0e0c;transition:transform .12s,box-shadow .12s}
.lever svg{width:18px;height:18px;fill:var(--name-ink);stroke:var(--name-ink);stroke-width:2;stroke-linejoin:round}
.lever:hover{background:linear-gradient(#46504a,#2c3330)}
.lever:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 #0b0e0c}
.lever-main{width:60px;height:56px;background:linear-gradient(#f2a516,#c9800a);border-color:#6b4405}
.lever-main:hover{background:linear-gradient(#f7b638,#d68c12)}
.lever-main svg{width:24px;height:24px;fill:var(--ink);stroke:var(--ink)}
.lever-main .ic-pause{display:none}
.app.playing .lever-main .ic-play{display:none}
.app.playing .lever-main .ic-pause{display:block}
.progress{min-width:0}
.progress-text{display:flex;gap:14px;align-items:baseline;font-size:13px;margin-bottom:6px}
#posText{font-weight:700;letter-spacing:.04em}
.phase-text{color:#aab6ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{height:8px;border-radius:4px;background:#0d100e;box-shadow:inset 0 1px 2px #000;overflow:hidden}
.rail-fill{height:100%;width:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,var(--lamp-done),var(--lamp-occ));transition:transform .4s var(--ease)}
.kbd-hint{margin:0;font-size:11.5px;color:#93a096;display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:240px}
.synthetic{margin:0;padding:5px 22px 8px;font-size:11.5px;color:#7f8c83;background:#161b18}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lane-card a{color:var(--plate-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

@media (max-width:1100px){
  .hdr{grid-template-columns:1fr auto;row-gap:10px}
  .routes{grid-column:1/-1;grid-row:2;justify-content:flex-start}
  .kbd-hint{display:none}
  .console{grid-template-columns:auto minmax(0,1fr) auto}
}
@media (max-width:820px){
  :root{--lane-w:136px;--stud-h:78px}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto auto}
  .hdr{grid-template-columns:1fr;padding:12px 14px}
  .hdr-sub{max-width:none}
  .routes{overflow-x:auto}
  .route-plate{flex:none}
  .hdr-tools{flex-wrap:wrap;gap:12px}
  .main{grid-template-columns:1fr}
  .board-wrap{padding:10px 0 0 10px}
  .board{height:62vh}
  .board-legend{flex-wrap:wrap;gap:10px}
  .lane-kind{display:none}
  .lane{padding:0 6px 0 6px}
  .lane-fold{width:22px;height:22px}
  .plate{border-left:0;border-top:1px solid #0c0f0d}
  .p-title{font-size:23px}
  .console{position:sticky;bottom:0;z-index:5;grid-template-columns:auto 1fr;gap:12px;padding:10px 14px}
  .speed{grid-column:1/-1;justify-self:end;margin-top:-4px}
  .hdr-sub{display:none}
  .routes{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible}
  .route-plate{min-width:0;padding:8px 10px}
  .rp-desc{display:none}
  #posText{white-space:nowrap}
  .phase-text{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <div class="hdr-title">
      <h1 id="hdrTitle"></h1>
      <p class="hdr-sub" id="hdrSub"></p>
    </div>
    <nav class="routes" id="routes" aria-label="Choose a sequence"></nav>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Detail level">
        <button class="seg-btn" data-level="plain" aria-pressed="true">Plain</button>
        <button class="seg-btn" data-level="tech" aria-pressed="false">Technical</button>
      </div>
      <label class="switch" id="whatifWrap" title="Insert the failure branches into the sequence">
        <input type="checkbox" id="whatif"><span class="switch-track" aria-hidden="true"></span><span class="switch-label">What if it fails?</span>
      </label>
    </div>
  </header>

  <main class="main">
    <section class="board-wrap" aria-label="Sequence diagram">
      <div class="board-head">
        <div class="board-legend" aria-label="Lamp legend">
          <span><i class="lamp l-set"></i>Ready</span>
          <span><i class="lamp l-occ"></i>Moving</span>
          <span><i class="lamp l-ret"></i>Reply</span>
          <span><i class="lamp l-done"></i>Done</span>
          <span><i class="lamp l-stop"></i>Stopped</span>
        </div>
        <div class="board-actions">
          <button class="chip-btn" id="focusLanes" aria-pressed="false" title="Fold every track this step doesn't use">Focus this step</button>
          <button class="chip-btn" id="unfoldAll">Unfold all</button>
        </div>
      </div>
      <div class="board" id="board">
        <div class="lanes" id="lanes" role="list"></div>
        <div class="tracks" id="tracks">
          <div class="studs" id="studs" role="group" aria-label="Steps"></div>
          <svg id="svg" class="svg" aria-hidden="true"></svg>
        </div>
      </div>
    </section>

    <aside class="plate" id="plate" aria-label="Step detail"></aside>
  </main>
  <div id="sr" class="sr-only" aria-live="polite"></div>

  <footer class="console" aria-label="Playback">
    <div class="lever-group">
      <button class="lever" id="btnRestart" aria-label="Restart sequence" title="Restart (Home)"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
      <button class="lever" id="btnPrev" aria-label="Previous step" title="Previous (&larr;)"><svg viewBox="0 0 24 24"><path d="M16 5l-9 7 9 7z"/></svg></button>
      <button class="lever lever-main" id="btnPlay" aria-label="Play" title="Play / pause (Space)"><svg viewBox="0 0 24 24" class="ic-play"><path d="M7 4l13 8-13 8z"/></svg><svg viewBox="0 0 24 24" class="ic-pause"><path d="M7 4h4v16H7zM14 4h4v16h-4z"/></svg></button>
      <button class="lever" id="btnNext" aria-label="Next step" title="Next (&rarr;)"><svg viewBox="0 0 24 24"><path d="M8 5l9 7-9 7z"/></svg></button>
    </div>
    <div class="progress">
      <div class="progress-text"><span id="posText">Step 1</span><span id="phaseText" class="phase-text"></span></div>
      <div class="rail" id="rail" aria-hidden="true"><div class="rail-fill" id="railFill"></div></div>
    </div>
    <div class="speed seg" role="group" aria-label="Speed">
      <button class="seg-btn" data-speed="0.5" aria-pressed="false">0.5&times;</button>
      <button class="seg-btn" data-speed="1" aria-pressed="true">1&times;</button>
      <button class="seg-btn" data-speed="2" aria-pressed="false">2&times;</button>
    </div>
    <p class="kbd-hint" id="kbdHint"></p>
  </footer>
  <p class="synthetic" id="footnote"></p>
</div>
<script>
// Worked example: loan funding review (scrubbed). See reference/data-schema.md.
window.FLOW = {
  "meta": {
    "title": "Loan funding review",
    "subtitle": "How a dealer's funding package moves through a lender's systems and becomes a decision",
    "footnote": "Worked example for the interactive-sequence-explorer skill. Names are generic; IDs, values and SQL are illustrative.",
    "phasesPlain": {
      "Webhook": "LOS alert",
      "Sweep": "Timer check",
      "Stipulations": "Lender conditions"
    }
  },
  "lanes": {
    "los": {
      "name": "LOS",
      "kind": "Loan origination system",
      "plain": "The dealer-facing loan origination system. It holds each application and the documents the dealer uploads.",
      "tech": [
        [
          "Owner",
          "External (the LOS vendor)"
        ],
        [
          "Calls us",
          "POST /v1/webhooks/los/applications/{applicationNumber}"
        ],
        [
          "We call it",
          "\"application fetch\" (application) and \"documents fetch\" (documents) data sources through Los.Sdk"
        ]
      ],
      "refs": [
        "los-sdk"
      ],
      "kindPlain": "Loan origination system"
    },
    "api": {
      "name": "Lending API",
      "kind": "api-host Lambda",
      "plain": "Our API. It receives LOS's alerts, imports the application and serves the funder portal.",
      "tech": [
        [
          "Runtime",
          ".NET 10 api-host Lambda behind API Gateway, CloudFront and WAF"
        ],
        [
          "Auth",
          "Cognito OAuth2 access tokens; scopes lending-api:access, applications:webhook, funding-reviews:read, funding-reviews:decision"
        ],
        [
          "Code",
          "src/Lending.Functions/LosWebhook/LosWebhookEndpoints.cs, FundingReview/FundingReviewPortalEndpoints.cs"
        ]
      ],
      "refs": [
        "lending-api"
      ],
      "kindPlain": "Our API"
    },
    "flags": {
      "name": "Feature flags",
      "kind": "AWS AppConfig",
      "plain": "On/off switches that let us turn a feature on in one environment without a release.",
      "tech": [
        [
          "Service",
          "AWS AppConfig, application lending-api, profile feature-flags"
        ],
        [
          "Flags",
          "los-document-import (document copy), funding-review-sweep (reviews). Both created disabled, in the console"
        ],
        [
          "Refresh",
          "Cached about 15 s by IFeatureFlagsProvider"
        ]
      ],
      "refs": [
        "infrastructure"
      ],
      "kindPlain": "On/off switches"
    },
    "db": {
      "name": "Lending database",
      "kind": "Aurora PostgreSQL",
      "plain": "Where applications, work queues, document records and review results live. Every row belongs to one lender (tenant) and nothing can be deleted.",
      "tech": [
        [
          "Engine",
          "Aurora PostgreSQL 17 through RDS Proxy, IAM auth as lending_app_iam"
        ],
        [
          "Isolation",
          "Row-level security per TenantId; tenant-scoped foreign keys"
        ],
        [
          "Integrity",
          "Append-only triggers, frozen finished rows, two-way state checks"
        ],
        [
          "Schema",
          "Lending.Database package (EF Core migrations)"
        ]
      ],
      "refs": [
        "lending-database"
      ],
      "kindPlain": "Our database",
      "store": true
    },
    "sched": {
      "name": "Scheduler",
      "kind": "EventBridge Scheduler",
      "plain": "A clock. Every five minutes it wakes a background worker to see if there is work.",
      "tech": [
        [
          "Service",
          "Amazon EventBridge Scheduler, rate(5 minutes), UTC"
        ],
        [
          "Retries",
          "None on the schedule; the Lambda's async invoke retries a failed run twice"
        ],
        [
          "Input",
          "{\"job\":\"sweep\",\"scheduledTime\":<aws.scheduler.scheduled-time>,\"executionId\":<aws.scheduler.execution-id>}"
        ]
      ],
      "refs": [
        "infrastructure"
      ],
      "kindPlain": "Timer"
    },
    "worker": {
      "name": "Document worker",
      "kind": "los-document-jobs Lambda",
      "plain": "A background job that copies new or changed documents from LOS into our own secure storage.",
      "tech": [
        [
          "Function",
          "…-compute-los-document-jobs: arm64, 2048 MB, 300 s, reserved concurrency 1"
        ],
        [
          "Bundle",
          "api-host bundle with Lending__FunctionSurface=los-document-jobs"
        ],
        [
          "May",
          "Read the documents secret, GenerateDataKey on the PII key, connect as lending_app_iam, read feature flags, PutObject under los/tenants/"
        ]
      ],
      "refs": [
        "lending-api · DocumentSync"
      ],
      "kindPlain": "Background job"
    },
    "s3": {
      "name": "Document storage",
      "kind": "Amazon S3",
      "plain": "Secure file storage. Originals are kept forever (until a retention period is set) and every file is encrypted.",
      "tech": [
        [
          "Documents bucket",
          "…-compute-application-docs-{account}, prefix los/tenants/: versioned, SSE-KMS with the PII key, deletes denied, access-logged"
        ],
        [
          "Artifacts bucket",
          "…-funding-review-artifacts-{account}, prefix funding/tenants/: the document review's parses, encrypted again by the app"
        ]
      ],
      "refs": [
        "infrastructure"
      ],
      "kindPlain": "File storage"
    },
    "sweep": {
      "name": "Review sweep",
      "kind": "funding-review-jobs Lambda",
      "plain": "A background job that spots applications whose documents changed and starts a review for them.",
      "tech": [
        [
          "Function",
          "…-compute-funding-review-jobs: VPC, 512 MB, 300 s, reserved concurrency 1"
        ],
        [
          "May",
          "states:StartExecution on the funding-review state machine only; GenerateDataKey (PII envelope); RDS Proxy; AppConfig"
        ],
        [
          "Settings",
          "Lending:FundingReview:StartAgainAfter 1 min, RetireRunningAfter 75 min, MaxActiveRuns = steps reserved concurrency ÷ document concurrency"
        ]
      ],
      "refs": [
        "lending-api · FundingReview"
      ],
      "kindPlain": "Background job"
    },
    "sfn": {
      "name": "Workflow engine",
      "kind": "AWS Step Functions",
      "plain": "Runs the review's steps in order, retries a step when something is busy, and catches failures. It only ever passes IDs between steps, never customer data.",
      "tech": [
        [
          "State machine",
          "funding-review (STANDARD), execution name run-{runId}, timeout 3600 s, X-Ray on, logs ERROR without execution data"
        ],
        [
          "States",
          "Begin → Documents (Map) → Rules → SecondReading → Stips → Score → Finalize; any failure → MarkFailed → Fail"
        ],
        [
          "Retries",
          "Lambda throttles 15× up to 300 s; ModelThrottled on Document, SecondReading, Stips"
        ]
      ],
      "refs": [
        "infrastructure"
      ],
      "kindPlain": "Workflow"
    },
    "steps": {
      "name": "Review worker",
      "kind": "funding-review-steps Lambda",
      "plain": "Does the actual work of each step: reads the documents, checks the funding rules and scores the results.",
      "tech": [
        [
          "Function",
          "…-compute-funding-review-steps: VPC, 3008 MB, 900 s, reserved concurrency 5 (dev) / 10 (prod)"
        ],
        [
          "Engine",
          "Documents.Sdk in-process: PdfPig, PDFium, Textract, Bedrock, GoRules ZEN"
        ],
        [
          "Event",
          "{step, runId, tenantId, executionArn?, documentId?, error?, failure?} → {step, status, documentIds?, counts?}"
        ]
      ],
      "refs": [
        "lending-api · FundingReview"
      ],
      "kindPlain": "Workflow worker"
    },
    "textract": {
      "name": "Text reader",
      "kind": "Amazon Textract",
      "plain": "Turns scanned pages (pictures of paper) into text the system can read.",
      "tech": [
        [
          "API",
          "DetectDocumentText, synchronous, one page image per call (no S3 input)"
        ],
        [
          "When",
          "A PDF page with under 20 characters of text layer (under 200 if mostly image), each TIFF frame and each image, rendered at 200 dpi"
        ]
      ],
      "refs": [
        "documents-sdk"
      ],
      "kindPlain": "Scan-to-text service"
    },
    "bedrock": {
      "name": "AI reader",
      "kind": "Amazon Bedrock",
      "plain": "An AI model that reads the documents' fields and, separately, double-checks anything the rules flagged without being told the expected answer.",
      "tech": [
        [
          "API",
          "Bedrock Runtime Converse, structured output as one forced tool"
        ],
        [
          "Model",
          "Cross-region inference profile us.anthropic.claude-haiku-5-5 (us-east-1, us-east-2, us-west-2)"
        ],
        [
          "Guard",
          "IAM allows only that profile and the model behind it; hourly token alarm"
        ]
      ],
      "refs": [
        "documents-sdk"
      ],
      "kindPlain": "AI service"
    },
    "portal": {
      "name": "Funder portal",
      "kind": "Review UI",
      "plain": "Where a funder reviews the result, answers flagged checks and approves or returns the package.",
      "tech": [
        [
          "App",
          "funding-frontend (Next.js)"
        ],
        [
          "Calls",
          "lending-api /v1/funding-reviews/... with a client_credentials token; the funder's email in X-On-Behalf-Of-Actor-Email"
        ]
      ],
      "refs": [
        "funding-portal"
      ],
      "kindPlain": "Review screen"
    }
  },
  "seqs": {
    "a": {
      "code": "A",
      "title": "Documents arrive",
      "lanes": [
        "los",
        "api",
        "flags",
        "db",
        "sched",
        "worker",
        "s3"
      ],
      "steps": [
        {
          "id": "a1",
          "route": [
            "los",
            "api"
          ],
          "label": "docsAdded",
          "phase": "Webhook",
          "title": "LOS says new documents were added",
          "story": "A dealer uploaded documents to a loan application in LOS. LOS immediately calls our API: \"application 234892 changed, and documents were added\".",
          "why": "We don't poll LOS. It tells us when something changes, so the review can start within minutes.",
          "call": {
            "verb": "POST",
            "text": "/v1/webhooks/los/applications/{applicationNumber}?docsAdded=true"
          },
          "kv": [
            [
              "Auth",
              "Bearer token with scope lending-api:access or applications:webhook"
            ],
            [
              "Route rule",
              "applicationNumber: 1 to 18 digits"
            ],
            [
              "Idempotency",
              "X-LOS-Delivery-Id is hashed into the import's idempotency key"
            ]
          ],
          "req": {
            "cap": "Request",
            "lang": "http",
            "body": "POST /v1/webhooks/los/applications/234892?docsAdded=true HTTP/1.1\nHost: <api host>\nAuthorization: Bearer <access token>\nX-LOS-Delivery-Id: delivery-docs-f86e20e8a7dd469f8625218ab9093a54\nContent-Length: 0"
          },
          "notes": [
            "No request body: the application number in the path is the whole message.",
            "<code>docsAdded</code> is read only while the <code>los-document-import</code> flag is on. With the flag on, any value but <code>true</code> or <code>false</code> returns <code>422 los-webhook.validation-failed</code> before LOS is called.",
            "A bad application number returns <code>422</code>: <code>'applicationNumber' must contain 1 to 18 digits.</code>"
          ],
          "refs": [
            "los-sdk",
            "lending-api"
          ],
          "labelPlain": "new docs"
        },
        {
          "id": "a2",
          "route": [
            "api",
            "flags"
          ],
          "label": "flag?",
          "phase": "Webhook",
          "title": "Is document copying switched on?",
          "story": "The API checks a switch, once per request. If document copying is switched off, it imports the application and ignores the documents.",
          "why": "Each environment can turn this on separately, without shipping new code.",
          "call": {
            "verb": "SDK",
            "text": "IFeatureFlagsProvider.GetAsync() → FeatureFlags.LosDocumentImport"
          },
          "kv": [
            [
              "Flag",
              "los-document-import"
            ],
            [
              "Store",
              "AppConfig lending-api / feature-flags"
            ],
            [
              "Default",
              "Off (created disabled in the console)"
            ]
          ],
          "res": {
            "cap": "Flag value (AppConfig feature-flags profile)",
            "lang": "json",
            "body": "{\n  \"los-document-import\": { \"enabled\": true }\n}"
          },
          "refs": [
            "lending-api",
            "infrastructure"
          ],
          "labelPlain": "switched on?",
          "resLabel": "enabled: true",
          "resLabelPlain": "it's on"
        },
        {
          "id": "a3",
          "route": [
            "api",
            "los"
          ],
          "label": "fetch app",
          "phase": "Import",
          "title": "API fetches the latest application",
          "story": "The API asks LOS for the full, current application (applicants, deal, vehicle, notes) so our copy matches LOS's.",
          "why": "The alert carries only a number. We always fetch fresh data rather than trust a payload.",
          "call": {
            "verb": "SDK",
            "text": "Los.Sdk → LOS \"application fetch\" (consolidated) data source"
          },
          "kv": [
            [
              "Pipeline",
              "import, the same as POST /v1/applications/imports/los with mode: upsert, dryRun: false"
            ],
            [
              "Secret",
              "LOS:ConsolidatedFetchSecretName (Secrets Manager)"
            ],
            [
              "On a redelivery",
              "Same X-LOS-Delivery-Id: replays the stored result, no LOS call"
            ]
          ],
          "res": {
            "cap": "Provider result (summarised)",
            "lang": "json",
            "body": "{\n  \"applicationNumber\": \"234892\",\n  \"providerHttpStatusCode\": 200,\n  \"providerDurationMilliseconds\": 842,\n  \"fields\": { \"Applicant - FirstNm\": \"<encrypted at rest>\", \"Contract - Vehicle VIN\": \"<encrypted at rest>\", \"Customfields.Line Of Business\": \"Indirect\" }\n}"
          },
          "notes": [
            "Applicant data is encrypted with <code>IApplicationPiiEncryptor</code> (KMS envelope) before it is written."
          ],
          "refs": [
            "lending-api",
            "los-sdk"
          ],
          "labelPlain": "get app",
          "resLabel": "application",
          "resLabelPlain": "app details"
        },
        {
          "id": "a4",
          "route": [
            "api",
            "db"
          ],
          "label": "upsert",
          "phase": "Import",
          "title": "Application data is saved",
          "story": "The application and a record of this import are saved. If the application already exists, it's updated in place.",
          "call": {
            "verb": "SQL",
            "text": "UPSERT LoanApplications; INSERT ImportRuns, ImportItems"
          },
          "tables": [
            {
              "name": "LoanApplications",
              "op": "UPSERT",
              "cols": [
                [
                  "Id, TenantId",
                  "the Lending application id"
                ],
                [
                  "InternalApplicationId",
                  "LOS application number (234892)"
                ],
                [
                  "…",
                  "deal, applicants and vehicle (PII encrypted)"
                ]
              ],
              "sql": "INSERT INTO \"LoanApplications\"\n  (\"Id\", \"TenantId\", \"InternalApplicationId\", \"EncryptedDeal\",\n   \"EncryptedApplicants\", \"EncryptedVehicle\", \"UpdatedAt\")\nVALUES (@id, @tenant, '234892', @deal, @applicants, @vehicle, now())\nON CONFLICT (\"TenantId\", \"InternalApplicationId\") DO UPDATE\n   SET \"EncryptedDeal\"       = excluded.\"EncryptedDeal\",\n       \"EncryptedApplicants\" = excluded.\"EncryptedApplicants\",\n       \"EncryptedVehicle\"    = excluded.\"EncryptedVehicle\",\n       \"UpdatedAt\"           = now()\nRETURNING \"Id\";"
            },
            {
              "name": "ImportRuns",
              "op": "INSERT",
              "cols": [
                [
                  "Id",
                  "importRunId returned to LOS"
                ],
                [
                  "Status, SuccessfulCount",
                  "Completed, 1"
                ],
                [
                  "IdempotencyKey, RequestFingerprintSha256",
                  "from X-LOS-Delivery-Id, so a redelivery replays"
                ],
                [
                  "ImportMode, DryRun",
                  "Upsert, false"
                ]
              ],
              "sql": "-- a redelivery with the same key and fingerprint replays this run instead\nINSERT INTO \"ImportRuns\"\n  (\"Id\", \"TenantId\", \"IdempotencyKey\", \"RequestFingerprintSha256\",\n   \"ImportMode\", \"DryRun\", \"Status\", \"SuccessfulCount\", \"CreatedAt\")\nVALUES ('ed883ebe-…', '7d0e1c4a-…', @deliveryId, @fingerprint,\n        'Upsert', false, 'Completed', 1, now());"
            },
            {
              "name": "ImportItems",
              "op": "INSERT",
              "cols": [
                [
                  "ImportRunId",
                  "→ ImportRuns"
                ],
                [
                  "ApplicationNumber, Status",
                  "Succeeded"
                ]
              ],
              "sql": "INSERT INTO \"ImportItems\" (\"Id\", \"ImportRunId\", \"ApplicationNumber\", \"Status\")\nVALUES (@id, 'ed883ebe-…', '234892', 'Succeeded');"
            }
          ],
          "refs": [
            "lending-api",
            "lending-database"
          ],
          "labelPlain": "save app"
        },
        {
          "id": "a5",
          "route": [
            "api",
            "db"
          ],
          "label": "queue sync",
          "phase": "Queue",
          "title": "A document copy job is queued",
          "story": "Because documents were added, the API adds a \"copy this application's documents\" job to a queue. It doesn't wait for the copy, so LOS gets its answer in under a second.",
          "why": "LOS files can be large (one test package was 22 MB), so copying happens in the background.",
          "call": {
            "verb": "SQL",
            "text": "INSERT INTO \"DocumentSyncs\" (...) -- only if this import run has no sync yet"
          },
          "req": {
            "cap": "What is written",
            "lang": "sql",
            "body": "-- LosDocumentSyncQueue looks up the run's sync first (a replay finds it);\n-- UX_DocumentSyncs_ImportRun (TenantId, ImportRunId) is the backstop.\nINSERT INTO \"DocumentSyncs\"\n  (\"Id\", \"TenantId\", \"LoanApplicationId\", \"ApplicationNumber\",\n   \"ImportRunId\", \"Status\", \"AttemptCount\", \"NextAttemptAt\")\nVALUES\n  ('4b1f0d2e-…', '7d0e1c4a-…', 'e6af9133-…', '234892',\n   'ed883ebe-…', 'Pending', 0, now());"
          },
          "tables": [
            {

<script>
/* Interactive sequence explorer engine. Reads window.FLOW (see reference/data-schema.md). */
(function () {
  "use strict";
  const F = window.FLOW;

  const STEP_W = 164, LANE_H = 70, FOLD_H = 28, PAD = 26, HOP = 16;
  const BASE_MS = 3400, ROUND_TRIP_X = 1.6;
  const T_SET = .14, T_RUN0 = .16, T_RUN1 = .86, T_MID = .51;

  const app = $("#app"), board = $("#board"), lanesEl = $("#lanes"), studsEl = $("#studs"), svg = $("#svg"), plate = $("#plate"), sr = $("#sr");
  const SEQ_KEYS = Object.keys(F.seqs);

  const state = { seq: SEQ_KEYS[0], idx: 0, t: 1, playing: false, oneShot: false, speed: 1, level: META.defaultLevel === "tech" ? "tech" : "plain", whatif: false, folded: new Set(), focus: false, view: "step", laneId: null };
  let raf = 0, last = 0, dwellUntil = 0;
  let geo = { y: {}, h: {}, height: 0, width: 0 };
  let els = { train: null, trainRect: null, trainText: null, routes: [], lamps: [], occ: [], bands: [] };

  /* ---------- model ---------- */
  function seq() { return F.seqs[state.seq]; }
  function steps() {
    const all = seq().steps, base = all.filter(s => !s.alt);
    if (!state.whatif) return base;
    const out = [];
    base.forEach(s => { out.push(s); all.filter(a => a.alt && a.after === s.id).forEach(a => out.push(a)); });
    return out;
  }
  function cur() { return steps()[state.idx]; }
  function kindOf(s) { return s.kind || (s.route.length === 1 ? "internal" : "request"); }
  function roundTrip(s) {
    if (s.roundTrip === false || s.route.length < 2) return false;
    if (s.roundTrip === true) return true;
    const k = kindOf(s);
    return !!s.res && k !== "response" && k !== "failure";
  }
  const tech = () => state.level === "tech";
  const stepLabel = s => tech() ? s.label : (s.labelPlain || s.label);
  const resLabel = s => tech() ? (s.resLabel || "reply") : (s.resLabelPlain || s.resLabel || "reply");
  const laneKind = id => tech() ? F.lanes[id].kind : (F.lanes[id].kindPlain || F.lanes[id].kind);
  const phaseOf = s => tech() ? s.phase : (s.phasePlain || (META.phasesPlain || {})[s.phase] || s.phase);

  /* ---------- geometry ---------- */
  function studH() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stud-h")) || 86; }
  function layout() {
    let y = 0; const g = { y: {}, h: {}, height: 0 };
    seq().lanes.forEach(id => { const h = state.folded.has(id) ? FOLD_H : LANE_H; g.h[id] = h; g.y[id] = y + h / 2; y += h; });
    g.height = y + 12;
    g.width = PAD * 2 + steps().length * STEP_W;

  }
  function colX(i) { return PAD + i * STEP_W + STEP_W / 2; }
  function pathPoints(s, i) {
    const x = colX(i), r = s.route, pts = [];
    if (r.length === 1) {
      const y = geo.y[r[0]], dy = Math.min(22, geo.h[r[0]] / 2 - 4);
      return [[x, y], [x + 40, y], [x + 40, y - dy], [x - 16, y - dy], [x - 16, y], [x, y]];
    }
    let cx = x - ((r.length - 2) * HOP) / 2;
    pts.push([cx, geo.y[r[0]]]);
    for (let k = 1; k < r.length; k++) {
      pts.push([cx, geo.y[r[k]]]);
      if (k < r.length - 1) { cx += HOP; pts.push([cx, geo.y[r[k]]]); }
    }
    return pts;
  }
  function polyLen(pts) { let L = 0; for (let k = 1; k < pts.length; k++) L += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); return L; }

    const L = polyLen(pts) * f; let acc = 0;
    for (let k = 1; k < pts.length; k++) {
      const seg = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);

  }
  const easeInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const clamp01 = v => Math.min(1, Math.max(0, v));

  /* ---------- helpers ---------- */
  function el(name, attrs, parent) {

  /* ---------- chrome (title, routes, hint, footnote) ---------- */
  function renderChrome() {
    document.title = META.title || "Sequence explorer";
    $("#hdrTitle").textContent = META.title || "";
    $("#hdrSub").textContent = META.subtitle || "";

      const s = F.seqs[k];

    }).join("");
    $("#kbdHint").innerHTML = "<kbd>Space</kbd> play <kbd>&larr;</kbd><kbd>&rarr;</kbd> step " + (SEQ_KEYS.length > 1 ? SEQ_KEYS.map(k => "<kbd>" + esc(F.seqs[k].code) + "</kbd>").join("") + " route " : "") + "<kbd>T</kbd> detail";
    const hasAlt = SEQ_KEYS.some(k => F.seqs[k].steps.some(s => s.alt));
    $("#whatifWrap").hidden = !hasAlt;
    $$("[data-level]").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === state.level ? "true" : "false"));
  }

  /* ---------- render: board ---------- */
  function renderBoard() {
    layout();
    const st = steps(), s = cur();
    lanesEl.innerHTML = "";
    seq().lanes.forEach(id => {
      const L = F.lanes[id], folded = state.folded.has(id);
      const row = document.createElement("div");
      row.className = "lane" + (folded ? " folded" : "") + (s && s.route.includes(id) ? " active" : "");
      row.style.height = geo.h[id] + "px";
      row.setAttribute("role", "listitem");
      row.innerHTML =
        '<button class="lane-plate" data-lane="' + id + '" aria-label="' + esc(L.name) + ': what it is"><i class="lamp" data-lanelamp="' + id + '"></i><span style="min-width:0"><span class="lane-name">' + esc(L.name) + '</span><span class="lane-kind">' + esc(laneKind(id)) + '</span></span></button>' +
        '<button class="lane-fold" data-fold="' + id + '" aria-label="' + (folded ? "Unfold " : "Fold ") + esc(L.name) + ' track" aria-expanded="' + !folded + '"><svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></button>';
      lanesEl.appendChild(row);
    });
    studsEl.innerHTML = "";
    studsEl.style.width = geo.width + "px";
    studsEl.style.paddingLeft = PAD + "px";
    st.forEach((stp, i) => {
      const b = document.createElement("button");
      b.className = "stud" + (stp.alt ? " alt" : "") + (i < state.idx ? " done" : "") + (i === state.idx ? " current" : "");

      studsEl.appendChild(b);
    });
    svg.innerHTML = "";
    svg.setAttribute("width", geo.width);
    svg.setAttribute("height", geo.height);
    svg.setAttribute("viewBox", "0 0 " + geo.width + " " + geo.height);
    els = { routes: [], lamps: [], occ: [], bands: [] };
    const gBand = el("g", {}, svg), gTrk = el("g", {}, svg), gRoute = el("g", {}, svg), gLamp = el("g", {}, svg);
    st.forEach((stp, i) => els.bands.push(el("rect", { x: PAD + i * STEP_W, y: 0, width: STEP_W, height: geo.height, class: "col-band" }, gBand)));

      const y = geo.y[id], folded = state.folded.has(id);

  /* ---------- per-frame state ---------- */
  function lampClass(stp, k, t, kind, rt) {

      const isAlt = SEQ_KEYS.some(k => F.seqs[k].steps.some(s => s.id === h && s.alt));
      if (isAlt) { state.whatif = true; $("#whatif").checked = true; }
      for (const k of SEQ_KEYS) { if (F.seqs[k].steps.some(s => s.id === h)) { sq = k; break; } }
      state.seq = sq;
      i = Math.max(0, steps().findIndex(s => s.id === h));
    }
    $$(".route-plate").forEach(b => b.setAttribute("aria-pressed", b.dataset.seq === sq ? "true" : "false"));
    state.seq = sq; state.idx = i; state.t = 1;
    renderBoard(); renderPlate(); announce(); follow();
  }
  boot();
  window.addEventListener("hashchange", () => { setPlaying(false); boot(); });
})();

</script>
</body>
</html>
